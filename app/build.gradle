plugins { id 'com.android.application' }

android {
    namespace 'com.example.pocketpdf'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.pocketpdf'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'androidx.core:core:1.15.0'
}
